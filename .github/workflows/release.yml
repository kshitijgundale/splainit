name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-darwin
          npm ci
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Run credential-free tests
        run: npm test
      - name: Build ad-hoc app, DMG, and signed updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run build:release
      - name: Verify and stage release assets
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-release.py --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Reject tampered update packages
        run: python3 scripts/test-release-integrity.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Splainit $RELEASE_TAG" --notes-file docs/release-notes.md src-tauri/target/release-assets/"$RELEASE_TAG"/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
