[package]
name = "splainit"
version = "0.1.0"
description = "Explain selected text on macOS"
authors = ["Splainit"]
edition = "2021"

[lib]
name = "splainit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1.4.5"

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", features = ["json"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
zeroize = "1.9.0"
rusqlite = "0.40.2"
tauri-plugin-updater = "2.12.0"

[dev-dependencies]
base64 = "0.22.1"
minisign-verify = "0.2.5"

[features]
live-provider-smoke = []

[[example]]
name = "live_provider_smoke"
required-features = ["live-provider-smoke"]
